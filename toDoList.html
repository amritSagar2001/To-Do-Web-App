<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do list</title>
    <link rel="stylesheet" href="toDoListStyle.css">
</head>
<body>
    <div class="main">
        <div class="taskContainer">
            <h1>To-Do List</h1>
            <h2>Tasks</h2>
            <ul></ul>
            <div class="editBox">
            </div>
        </div>
        <div class="actionContainer">
            <h2>Actions</h2>
            <div class="btnBox">
                <input type="text" placeholder="Write your task" id="addInp">
                <button id="add">Add Task</button>
                <button id="reset">Reset To-Do List</button>
            </div>
        </div>
    </div>
    <script src="toDoListApp.js"></script>
</body>
</html>
